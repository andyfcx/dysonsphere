services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-observer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observer_secret}
      POSTGRES_DB: ${POSTGRES_DB:-observer}
    ports:
      - "${POSTGRES_EXPOSE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-observer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "${SERVER_EXPOSE_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-observer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observer_secret}
      POSTGRES_DB: ${POSTGRES_DB:-observer}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8000
      SERVER_TOKEN: ${SERVER_TOKEN:-dev-token}
      SERVER_ENROLLMENT_TOKEN: ${SERVER_ENROLLMENT_TOKEN:-enroll-dev-token}
      SERVER_LOGIN_USERNAME: ${SERVER_LOGIN_USERNAME:-admin}
      SERVER_LOGIN_PASSWORD: ${SERVER_LOGIN_PASSWORD:-admin}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${WEB_EXPOSE_PORT:-5173}:80"
    depends_on:
      server:
        condition: service_started

volumes:
  postgres_data:
