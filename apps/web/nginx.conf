server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to backend.
    # Use Docker's embedded DNS resolver so the upstream is resolved lazily
    # at request time instead of at nginx startup (avoids "host not found" crash).
    resolver 127.0.0.11 valid=10s;
    set $backend http://server:8000;
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: all other routes serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
