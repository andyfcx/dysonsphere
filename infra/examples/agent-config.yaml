# Observer Agent Configuration
# Generated by: observer-agent init
# Edit as needed before running: observer-agent run --config /etc/observer-agent/config.yaml

server:
  url: "http://your-observer-server:8000"
  token: "dev-token"

agent:
  machine_id: "replace-with-your-machine-id"   # auto-set by init
  hostname: "your-hostname"
  environment: "production"
  tags:
    - crawler
    - weibo
    - tw
  version: "0.1.0"
  state_file: "/var/lib/observer-agent/state.db"

  # Polling intervals
  heartbeat_interval: "30s"
  discovery_interval: "5m"
  process_scan_interval: "30s"
  report_interval: "1m"

# Data probes — optional, configure for your environment
probes:
  # Example: count records inserted today in a PostgreSQL table
  - name: "daily_events_count"
    type: "sql_count"
    schedule: "0 * * * *"   # every hour
    sql:
      dsn: "postgres://user:pass@localhost:5432/appdb?sslmode=disable"
      query: "SELECT COUNT(*) FROM events WHERE created_at > NOW() - INTERVAL '1 day'"

  # Example: check that a data export file is fresh
  - name: "export_file_freshness"
    type: "file_freshness"
    schedule: "*/15 * * * *"
    file:
      path: "/data/exports/latest.csv"
      max_age_seconds: 3600   # warn if older than 1 hour

  # Example: custom command probe
  - name: "queue_depth"
    type: "command"
    schedule: "*/5 * * * *"
    command:
      command: "/usr/local/bin/check-queue.sh"
      args: ["--output-count"]
