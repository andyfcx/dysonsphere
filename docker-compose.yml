version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-observer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observer_secret}
      POSTGRES_DB: ${POSTGRES_DB:-observer}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-observer}"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "8000:8000"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-observer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observer_secret}
      POSTGRES_DB: ${POSTGRES_DB:-observer}
      SERVER_PORT: 8000
      SERVER_TOKEN: ${SERVER_TOKEN:-dev-token}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_API_TOKEN: ${SERVER_TOKEN:-dev-token}
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_started

  # Local dev agent (generates sample data)
  seed:
    build:
      context: .
      dockerfile: apps/server/Dockerfile.seed
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-observer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-observer_secret}
      POSTGRES_DB: ${POSTGRES_DB:-observer}
      SERVER_URL: http://server:8000
      SERVER_TOKEN: ${SERVER_TOKEN:-dev-token}
    depends_on:
      server:
        condition: service_started
    profiles:
      - seed

volumes:
  postgres_data:
